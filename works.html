<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Works | Caryl Legada</title>

<style>
/* ===== COLOR PALETTE (Earthy Neutral) ===== */
:root {
    --primary:#A3B18A;    /* Sage Green */
    --secondary:#EBDCCB;  /* Sand Beige */
    --accent:#5F6F52;     /* Olive */
    --bg:#F7F4EF;         /* Warm Cream */
    --card-bg: rgba(255,255,255,0.75);
    --text:#4B453A;       /* Earthy Brown */
}

/* ===== GLOBAL ===== */
body {
    margin:0; 
    font-family:'Poppins',sans-serif; 
    background:var(--bg); 
    color:var(--text);
}

/* ===== HEADER (UNIFIED STYLE) ===== */
header {
    display:flex; 
    justify-content:space-between; 
    align-items:center;
    padding:20px 50px;
    background:var(--card-bg); 
    border-radius:0 0 20px 20px; 
    box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

header h2 {
    font-size:24px;
    font-weight:600;
}

header h2 span{
    color: var(--primary);
}

nav a{
    margin-left:20px;
    text-decoration:none;
    color:var(--text);
    font-weight:600;
    font-size:18px;
    transition:0.3s;
}

nav a:hover{
    color:var(--primary);
}

/* ===== GALLERY ===== */
.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
    padding:60px 50px;
}

.card{
    background: var(--card-bg);
    border-radius:15px;
    padding:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.05);
    transition:0.3s, transform 0.3s;
    overflow: hidden;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width: 100%;
    height: 220px; 
    object-fit: cover; 
    border-radius: 10px;
    transition:0.3s;
}

.card:hover img{
    transform: scale(1.05);
}

.card p{
    margin-top:10px;
    text-align:center;
    font-weight:500;
    color: var(--accent);
    font-size:18px;
}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
    header{
        flex-direction:column;
        align-items:flex-start;
    }
    nav{
        margin-top:10px;
    }
    .gallery{
        padding:40px 20px;
        gap:20px;
    }
}
</style>
</head>

<body>
<header>
    <h2>Caryl <span>Legada</span></h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="works.html">Works</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="gallery">
    <div class="card"><img src="image/2.png" alt="Graphic Design"><p>Graphic Design</p></div>
    <div class="card"><img src="image/4.png" alt="Poster"><p>Poster</p></div>
    <div class="card"><img src="image/3.png" alt="UI Layout"><p>Graphic Design</p></div>
    <div class="card"><img src="image/5.jpg" alt="Graphic Design"><p>Poster</p></div>
</section>

</body>
</html>
